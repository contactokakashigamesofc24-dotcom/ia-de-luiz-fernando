plugins { id 'com.android.application' }

android {
    signingConfigs {
        stable {
            storeFile file('navegador-signing.p12')
            storePassword System.getenv('NAVEGADOR_SIGNING_STOREPASS')
            keyAlias System.getenv('NAVEGADOR_SIGNING_ALIAS')
            keyPassword System.getenv('NAVEGADOR_SIGNING_KEYPASS')
        }
    }
    namespace 'br.com.luiz.navegadorlivre'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.luiz.navegadorlivre'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
