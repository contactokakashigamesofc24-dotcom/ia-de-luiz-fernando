name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p /tmp/android-src
          unzip -q android-wrapper-source.zip -d /tmp/android-src
          mv /tmp/android-src/IAdeLuizFernandoAndroid android-wrapper

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p android-wrapper assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IA-de-Luiz-Fernando-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: IA de Luiz Fernando APK v1.0.${{ github.run_number }}
          prerelease: true
          files: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
