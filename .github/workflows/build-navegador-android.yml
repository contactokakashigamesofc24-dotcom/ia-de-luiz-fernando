name: Build Navegador Livre Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'navegador-android/**'
      - '.github/workflows/build-navegador-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable signing key
        env:
          NAVIGADOR_KEYSTORE_B64: ${{ secrets.NAVEGADOR_SIGNING_KEYSTORE }}
        run: |
          echo "$NAVIGADOR_KEYSTORE_B64" | base64 --decode > navegador-android/app/navegador-signing.p12
      - name: Build APK signed with stable key
        env:
          NAVEGADOR_SIGNING_STOREPASS: ${{ secrets.NAVEGADOR_SIGNING_STOREPASS }}
          NAVEGADOR_SIGNING_KEYPASS: ${{ secrets.NAVEGADOR_SIGNING_KEYPASS }}
          NAVEGADOR_SIGNING_ALIAS: ${{ secrets.NAVEGADOR_SIGNING_ALIAS }}
        run: gradle --no-daemon -p navegador-android assembleDebug
      - name: Remove signing key file
        if: always()
        run: rm -f navegador-android/app/navegador-signing.p12
      - uses: actions/upload-artifact@v4
        with:
          name: navegador-livre-android-apk
          path: navegador-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navegador-livre-v1.0.5
          name: Navegador Livre Android v1.0.5 — dependência Android do login
          prerelease: true
          make_latest: false
          files: navegador-android/app/build/outputs/apk/debug/app-debug.apk
